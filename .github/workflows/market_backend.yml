name: Market Rewind Backend

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'How many hours to run the backend session?'
        required: true
        default: '1'

jobs:
  run-session:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install libsql

      - name: Run Backend Session
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DURATION_HOURS: ${{ github.event.inputs.duration }}
        run: |
          # 1. Setup Git Identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Starting Master Sync once..."
          
          # 2. Run the sync script ONCE
          python database/sync_backend.py
          
          # 3. Save to orphan branch data-storage ONCE
          git checkout --orphan data-storage || git checkout data-storage
          git rm -rf . --quiet || true
          mkdir -p database
          mv database/market_data.db .tmp_db
          rm -rf *
          mkdir -p database
          mv .tmp_db database/market_data.db
          
          git add database/market_data.db
          git commit -m "Final Master Sync [$(date)]"
          git push origin data-storage --force
          
          # 4. Stay active for the requested duration without doing any more syncs
          echo "Sync finished. Staying idle for $DURATION_HOURS hours..."
          SLEEP_SECONDS=$(echo "$DURATION_HOURS * 3600" | bc | cut -d. -f1)
          sleep $SLEEP_SECONDS
          
          echo "Backend session complete."
