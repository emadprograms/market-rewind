name: Sync Local Database

on:
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install libsql

      - name: Run Master Sync
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          # 1. Setup Git Identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Starting Master Sync once..."
          
          # 2. Run the sync script ONCE
          python database/sync_backend.py
          
          # 3. Save to orphan branch data-storage ONCE
          git checkout --orphan data-storage || git checkout data-storage
          git rm -rf . --quiet || true
          mkdir -p database
          mv database/market_data.db .tmp_db
          rm -rf *
          mkdir -p database
          mv .tmp_db database/market_data.db
          
          git add database/market_data.db
          git commit -m "Master Data Refresh [$(date)]"
          git push origin data-storage --force
          
          echo "Sync complete. Backend task finished."
