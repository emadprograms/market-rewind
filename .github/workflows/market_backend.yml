name: Market Rewind Backend

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'How many hours to run the backend session?'
        required: true
        default: '1'

jobs:
  run-session:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install libsql

      - name: Run Backend Session
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DURATION_HOURS: ${{ github.event.inputs.duration }}
        run: |
          # 1. Setup Git Identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. Determine End Time
          START_TIME=$(date +%s)
          DURATION_SECONDS=$(echo "$DURATION_HOURS * 3600" | bc | cut -d. -f1)
          END_TIME=$((START_TIME + DURATION_SECONDS))
          
          echo "Starting session for $DURATION_HOURS hours..."
          
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "--- Syncing at $(date) ---"
            
            # Run the sync script once
            python database/sync_backend.py 0 
            
            # Save to orphan branch data-storage
            git checkout --orphan data-storage || git checkout data-storage
            git rm -rf . --quiet || true
            mkdir -p database
            mv database/market_data.db .tmp_db
            rm -rf *
            mkdir -p database
            mv .tmp_db database/market_data.db
            
            git add database/market_data.db
            git commit -m "Update Market Data [$(date)]"
            git push origin data-storage --force
            
            # Switch back to main to get the script for next loop
            git checkout main
            
            # Sleep for 15 minutes
            echo "Waiting 15 minutes for next sync..."
            sleep 900
          done
          
          echo "Backend session complete."
