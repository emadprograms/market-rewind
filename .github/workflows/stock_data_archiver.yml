name: Stock Data Archiver

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        type: string
        default: '2025-10-01'
      to_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        type: string
        default: '2026-01-31'
      cooldown:
        description: 'Seconds between API calls per worker (default: 60)'
        required: false
        type: string
        default: '60'
      update_release:
        description: 'Sync Turso → SQLite and update GitHub Release after backfill?'
        required: false
        type: boolean
        default: false

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run the Stock Data Archiver backfill
  # ─────────────────────────────────────────────
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hour max for large date ranges

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install archiver dependencies
        run: pip install -r stock_data_archiver/requirements.txt

      - name: Run Stock Data Archiver
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          echo "🏁 Starting backfill: ${{ inputs.from_date }} → ${{ inputs.to_date }}"
          echo "   Cooldown: ${{ inputs.cooldown }}s per key"
          python stock_data_archiver/main.py \
            --from-date ${{ inputs.from_date }} \
            --to-date ${{ inputs.to_date }} \
            --cooldown ${{ inputs.cooldown }}

  # ─────────────────────────────────────────────
  # Job 2: Sync Turso → SQLite and publish release
  # ─────────────────────────────────────────────
  update-release:
    runs-on: ubuntu-latest
    needs: backfill
    if: ${{ inputs.update_release == true }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install sync dependencies
        run: pip install libsql

      - name: Sync Turso → Local SQLite
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "📦 Syncing Turso database to local SQLite..."
          python database/sync_backend.py

      - name: Upload as GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Uploading database as GitHub Release..."
          gh release delete latest-data --cleanup-tag -y || true
          git tag latest-data
          git push origin latest-data --force
          gh release create latest-data database/market_data.db \
            -t "Latest Market Data" \
            -n "Auto-synced from Turso after backfill (${{ inputs.from_date }} → ${{ inputs.to_date }})"

          echo "✅ Release updated successfully."
