name: Stock Data Archiver

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        type: string
        default: '2025-10-01'
      to_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        type: string
        default: '2026-01-31'
      cooldown:
        description: 'Seconds between API calls per worker (default: 60)'
        required: false
        type: string
        default: '60'
      update_release:
        description: 'Sync archive DB and update GitHub Release after backfill?'
        required: false
        type: boolean
        default: false

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run the Stock Data Archiver backfill
  # ─────────────────────────────────────────────
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install archiver dependencies
        run: pip install -r stock_data_archiver/requirements.txt

      - name: Run Stock Data Archiver
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          echo "🏁 Starting backfill: ${{ inputs.from_date }} → ${{ inputs.to_date }}"
          echo "   Cooldown: ${{ inputs.cooldown }}s per key"
          python stock_data_archiver/main.py \
            --from-date ${{ inputs.from_date }} \
            --to-date ${{ inputs.to_date }} \
            --cooldown ${{ inputs.cooldown }}

  # ─────────────────────────────────────────────────────────
  # Job 2: Sync archive DB → SQLite and publish GitHub Release
  # All credentials come from Infisical (no extra secrets needed)
  # ─────────────────────────────────────────────────────────
  update-release:
    runs-on: ubuntu-latest
    needs: backfill
    if: ${{ inputs.update_release == true }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r stock_data_archiver/requirements.txt
          pip install libsql

      - name: Sync Archive DB → Local SQLite
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "📦 Syncing archive database to local SQLite..."
          python stock_data_archiver/sync_release.py

      - name: Upload as GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Uploading archive database as GitHub Release..."
          gh release delete latest-archive --cleanup-tag -y || true
          git tag latest-archive
          git push origin latest-archive --force
          gh release create latest-archive database/archive_data.db \
            -t "Latest Archive Data" \
            -n "Archive database synced after backfill (${{ inputs.from_date }} → ${{ inputs.to_date }})"

          echo "✅ Release updated successfully."
